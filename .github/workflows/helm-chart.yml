name: helm-chart

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            helm lint "$chart"
          done

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package charts
        run: |
          for chart in charts/*/; do
            helm package "$chart" -d .packaged
          done

      - name: Push charts
        run: |
          for pkg in .packaged/*.tgz; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
