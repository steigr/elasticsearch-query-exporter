name: helm-chart

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "charts/elasticsearch-query-exporter/**"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/elasticsearch-query-exporter

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        run: helm package charts/elasticsearch-query-exporter -d .packaged

      - name: Push chart
        run: |
          for pkg in .packaged/*.tgz; do
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
