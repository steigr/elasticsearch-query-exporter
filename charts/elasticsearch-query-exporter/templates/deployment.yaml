apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elasticsearch-query-exporter.fullname" . }}
  labels:
    {{- include "elasticsearch-query-exporter.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "elasticsearch-query-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "elasticsearch-query-exporter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elasticsearch-query-exporter.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -web.listen-address=:{{ .Values.service.port }}
            - -elasticsearch.url={{ .Values.elasticsearch.url }}
            {{- if .Values.elasticsearch.username }}
            - -elasticsearch.username={{ .Values.elasticsearch.username }}
            {{- end }}
            {{- if .Values.elasticsearch.tls.existingSecret }}
            - -elasticsearch.ca-file=/etc/elasticsearch-query-exporter/tls/{{ .Values.elasticsearch.tls.caCertKey }}
            {{- end }}
            {{- if .Values.elasticsearch.tls.insecureSkipVerify }}
            - -elasticsearch.tls-insecure-skip-verify=true
            {{- end }}
            - -log.level={{ .Values.logLevel }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.elasticsearch.existingSecret }}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearch.existingSecret }}
                  key: {{ .Values.elasticsearch.existingSecretPasswordKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.elasticsearch.tls.existingSecret }}
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch-query-exporter/tls
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.elasticsearch.tls.existingSecret }}
        - name: elasticsearch-ca
          secret:
            secretName: {{ .Values.elasticsearch.tls.existingSecret }}
            items:
              - key: {{ .Values.elasticsearch.tls.caCertKey }}
                path: {{ .Values.elasticsearch.tls.caCertKey }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
