# Default values for elasticsearch-query-exporter.

replicaCount: 1

image:
  repository: ghcr.io/steigr/elasticsearch-query-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9206

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /probe

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# -- Elasticsearch connection settings. Defaults target an ECK-managed
# cluster named "elasticsearch" in the same namespace as this release.
elasticsearch:
  # -- Base URL of the Elasticsearch HTTP API.
  url: "https://elasticsearch-es-internal-http:9200"

  # -- Basic auth username. ECK's default superuser is "elastic".
  username: "elastic"

  # -- Basic auth password, read from an existing Secret key so it never
  # needs to appear in values. ECK creates one named "<cluster>-es-elastic-user"
  # holding the "elastic" superuser's password under a key of the same name.
  existingSecret: "elasticsearch-es-elastic-user"
  existingSecretPasswordKey: "elastic"

  tls:
    # -- Name of a Secret holding the CA certificate that signed the
    # cluster's HTTP certificate. ECK publishes this as
    # "<cluster>-es-http-certs-internal", key "ca.crt".
    existingSecret: "elasticsearch-es-http-certs-internal"
    caCertKey: "ca.crt"
    # -- Disable TLS certificate verification. Testing only — never enable
    # this against a real cluster.
    insecureSkipVerify: false

# -- Extra command-line flags appended to the container args, e.g.
# ["-web.listen-address=:9206"].
extraArgs: []

# -- Extra environment variables merged into the container's env.
extraEnv: []
# - name: FOO
#   value: bar

# -- Example ServiceMonitor for the prometheus-operator. Each entry in
# queries becomes one scrape endpoint on /probe with the given query
# parameters. See examples/servicemonitor-*.yaml for standalone worked
# examples against an ECK cluster.
serviceMonitor:
  enabled: false
  # -- Labels added to the ServiceMonitor object itself, e.g. so it matches
  # a Prometheus resource's serviceMonitorSelector.
  labels: {}
  # -- Scrape interval for every query below.
  interval: 60s
  # -- Timeout for a single scrape. Should comfortably exceed the time an
  # Elasticsearch query can take.
  scrapeTimeout: 30s
  # -- One entry per distinct query to run against Elasticsearch. Each
  # becomes a separate endpoint in the ServiceMonitor, scraping /probe
  # with these query parameters.
  queries: []
  # - name: error-logs
  #   indexPattern: "logs-*"
  #   searchString: "level:error"
  #   timeField: "@timestamp"
  #   metricName: "elasticsearch_error_log_count"
  #   labelFieldMap:
  #     service: service.name
  #     host: host.name
  #   queryId: "error-logs"
