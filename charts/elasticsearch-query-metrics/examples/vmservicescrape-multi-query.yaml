# Standalone VMServiceScrape example (not templated by the chart) for the
# VictoriaMetrics operator, mirroring examples/servicemonitor-multi-query.yaml.
# Assumes the exporter was installed with
# `helm install elasticsearch-query-exporter charts/elasticsearch-query-exporter`,
# which labels its Service app.kubernetes.io/name=elasticsearch-query-exporter,
# app.kubernetes.io/instance=elasticsearch-query-exporter.
#
# Each endpoint hits /probe with different query parameters, so it gets its
# own internal query ID and its own incremental time window in the
# exporter (see CLAUDE.md).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: elasticsearch-query-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-query-exporter
      app.kubernetes.io/instance: elasticsearch-query-exporter
  endpoints:
    # Error-level log lines per service/host, restricted to namespaces
    # matching "application*" via document-field-filter.
    - port: http
      path: /probe
      interval: 60s
      scrapeTimeout: 30s
      params:
        index-pattern:
          - "logs-*"
        search-string:
          - "level:error"
        time-field:
          - "@timestamp"
        metric-name:
          - "elasticsearch_error_log_count"
        query-id:
          - "error-logs"
        label-field-map:
          - "service=service.name"
          - "host=host.name"
        document-field-filter:
          - "kubernetes.namespace=application*"

    # Failed login attempts per source IP, matched via a plain wildcard
    # query_string pattern against the "message" field.
    - port: http
      path: /probe
      interval: 60s
      scrapeTimeout: 30s
      params:
        index-pattern:
          - "auth-*"
        search-string:
          - "*failed login*"
        field:
          - "message"
        time-field:
          - "@timestamp"
        metric-name:
          - "elasticsearch_failed_login_count"
        query-id:
          - "failed-logins"
        label-field-map:
          - "source_ip=source.ip"
          - "user=user.name"

    # Slow requests (>5s), matched with an explicit query_string field.
    - port: http
      path: /probe
      interval: 120s
      scrapeTimeout: 60s
      params:
        index-pattern:
          - "logs-*"
        search-string:
          - "duration_ms:>5000"
        pattern-type:
          - "query_string"
        field:
          - "message"
        time-field:
          - "@timestamp"
        metric-name:
          - "elasticsearch_slow_request_count"
        query-id:
          - "slow-requests"
        label-field-map:
          - "route=url.path"
          - "method=http.method"
