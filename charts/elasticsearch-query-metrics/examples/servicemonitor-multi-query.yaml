# Standalone ServiceMonitor example with multiple independent queries, one
# per endpoint. Each endpoint hits the same /probe path with different
# query parameters, so it gets its own internal query ID and its own
# incremental time window in the exporter (see CLAUDE.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: elasticsearch-query-metrics
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-query-exporter
      app.kubernetes.io/instance: elasticsearch-query-exporter
  endpoints:
    # Error-level log lines per service/host, restricted to namespaces
    # matching "application*" via document-field-filter.
    - port: http
      path: /probe
      interval: 60s
      scrapeTimeout: 30s
      params:
        index-pattern:
          - "logs-*"
        search-string:
          - "level:error"
        time-field:
          - "@timestamp"
        metric-name:
          - "elasticsearch_error_log_count"
        query-id:
          - "error-logs"
        label-field-map:
          - "service=service.name"
          - "host=host.name"
        document-field-filter:
          - "kubernetes.namespace=application*"

    # Failed login attempts per source IP, matched via a plain wildcard
    # query_string pattern against the "message" field.
    - port: http
      path: /probe
      interval: 60s
      scrapeTimeout: 30s
      params:
        index-pattern:
          - "auth-*"
        search-string:
          - "*failed login*"
        field:
          - "message"
        time-field:
          - "@timestamp"
        metric-name:
          - "elasticsearch_failed_login_count"
        query-id:
          - "failed-logins"
        label-field-map:
          - "source_ip=source.ip"
          - "user=user.name"

    # Slow requests (>5s), matched with an explicit query_string field.
    # pattern-type is stated explicitly here even though it's the default,
    # to show the parameter exists.
    - port: http
      path: /probe
      interval: 120s
      scrapeTimeout: 60s
      params:
        index-pattern:
          - "logs-*"
        search-string:
          - "duration_ms:>5000"
        pattern-type:
          - "query_string"
        field:
          - "message"
        time-field:
          - "@timestamp"
        metric-name:
          - "elasticsearch_slow_request_count"
        query-id:
          - "slow-requests"
        label-field-map:
          - "route=url.path"
          - "method=http.method"
