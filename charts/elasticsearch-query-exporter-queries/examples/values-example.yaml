# Example values.yaml, targeting an elasticsearch-query-exporter chart
# release named "elasticsearch-query-exporter" (the default). Adjust
# serviceSelectorLabels if you installed that chart under a different
# release name.
#
#   helm install elasticsearch-query-exporter-queries \
#     charts/elasticsearch-query-exporter-queries \
#     -f charts/elasticsearch-query-exporter-queries/examples/values-example.yaml

serviceSelectorLabels:
  app.kubernetes.io/name: elasticsearch-query-exporter
  app.kubernetes.io/instance: elasticsearch-query-exporter

serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 30s

# Uncomment to also (or instead) render a VMServiceScrape for the
# VictoriaMetrics operator — it reads the same `queries` list below.
# vmServiceScrape:
#   enabled: true

queries:
  # Counts documents matching "level:error" in logs-* per (service, host),
  # scraped incrementally since the previous successful scrape.
  - name: error-logs
    indexPattern: "logs-*"
    searchString: "level:error"
    timeField: "@timestamp"
    metricName: "elasticsearch_error_log_count"
    queryId: "error-logs"
    labelFieldMap:
      service: service.name
      host: host.name

  # Counts slow HTTP requests (>5s) per route, using an explicit field
  # for the query_string match instead of "*".
  - name: slow-requests
    indexPattern: "logs-*"
    searchString: "duration_ms:>5000"
    field: "message"
    timeField: "@timestamp"
    metricName: "elasticsearch_slow_request_count"
    queryId: "slow-requests"
    labelFieldMap:
      route: url.path
      method: http.method
